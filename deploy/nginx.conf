# /etc/nginx/sites-available/aion2.taylorjohannsen.com
#
# nginx serves public/ straight off disk and hands /api/ to the Node relay
# (server.js under pm2 on 127.0.0.1:3005). Run certbot after enabling this to
# add HTTPS:  sudo certbot --nginx -d aion2.taylorjohannsen.com

server {
    listen 80;
    listen [::]:80;
    server_name aion2.taylorjohannsen.com;

    root /opt/aion2-checklist/public;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location /icons/ {
        expires 7d;
    }

    location / {
        # revalidate pages, scripts and data so updates show up right away
        expires -1;
        try_files $uri $uri/ =404;
    }
}
